<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>PA#2</title>
    <style>
        body {
            background-color: #EEEEEE;
        }
    </style>

</head>

<body>

    <h2>Astroidal Torus</h2>
    <div>
        <label for="conv">Convergence</label>
        <input type="range" name="conv" id="conv" min="10" max="1000" value="1000" step="10"><br>
        <label for="eyes">Eye Separation</label>
        <input type="range" name="eyes" id="eyes" min="1" max="10" value="1" step="0.2"><br>
        <label for="fov">Field of View</label>
        <input type="range" name="fov" id="fov" min="0.01" max="3" value="1" step="0.01"><br>
        <label for="near">Near clipping distance</label>
        <input type="range" name="near" id="near" min="1" max="15" value="1" step="0.1"><br>
    </div>
    <div id="canvas-holder" style="position: relative">
        <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
    </div>

    <script defer type="module" src="./main.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    
</body>

</html>
